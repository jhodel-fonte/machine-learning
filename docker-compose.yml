services:
  recommender-api:
    build: .
    container_name: pgpc_ml_api
    restart: unless-stopped
    working_dir: /app
    ports:
      - "${ML_API_PORT:-8005}:5000"
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      FLASK_APP: app
      FLASK_DEBUG: "0"
      DB_HOST: ${DB_HOST_CONTAINER:-host.docker.internal}
    command: gunicorn --bind 0.0.0.0:5000 --timeout ${REQUEST_TIMEOUT_SECONDS:-30} app:app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - pgpc-internal

  recommender-trainer:
    build: .
    container_name: pgpc_ml_trainer
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST_CONTAINER:-host.docker.internal}
    command: python auto_train.py
    networks:
      - pgpc-internal

networks:
  pgpc-internal:
    external: true